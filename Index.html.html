<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maafin Aku Ya</title>
    <!-- Memanggil Font Quicksand yang lucu dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffd1dc; /* Background pink pastel */
            font-family: 'Quicksand', sans-serif;
            overflow: hidden; /* Mencegah halaman bisa di-scroll */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        /* --- Animasi Gelembung Hati & Teks (Melayang dari Bawah ke Atas) --- */
        .bubble {
            position: absolute;
            bottom: -50px;
            color: #ff69b4;
            font-weight: bold;
            font-size: 1.5rem;
            opacity: 0.6;
            z-index: 0;
            animation: floatUp linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            10% { opacity: 0.7; }
            100% { transform: translateY(-120vh) scale(1.2); opacity: 0; }
        }

        /* --- Desain Utama Polaroid --- */
        .polaroid-container {
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .polaroid {
            background: white;
            padding: 15px 15px 30px 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
            /* Dibuat sedikit miring seperti foto yang ditaruh di meja */
            transform: rotate(-3deg);
            transition: transform 0.4s ease;
            width: 320px;
            max-width: 85%;
        }

        /* Saat kursor didekatkan, polaroidnya lurus */
        .polaroid:hover {
            transform: rotate(0deg) scale(1.02);
        }

        /* Foto di dalam polaroid */
        .polaroid img {
            width: 100%;
            height: 320px;
            object-fit: cover; /* Menjaga rasio foto agar tidak gepeng */
            background-color: #eee;
        }

        h1 {
            color: #ff1493;
            font-size: 1.8rem;
            margin: 20px 0 5px 0;
        }

        p {
            color: #d147a3;
            font-size: 1.1rem;
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* --- Desain Tombol --- */
        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            position: relative;
        }

        button {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 12px 15px;
            font-size: 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            flex: 1; /* Membuat ukuran tombol seimbang */
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.3);
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #ff1493;
        }

        /* Tombol "Tidak Dimaafkan" diberi efek transisi agar bergeser mulus */
        #btnTidak {
            position: relative;
            transition: transform 0.2s ease-out;
        }

        /* --- Tampilan Ketika Sukses Dimaafkan --- */
        #successState {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Lagu Backsound (Ganti link src dengan lagumu) -->
    <audio id="backsound" loop>
        <source src="ISELL.mp3" type="audio/mpeg">
    </audio>

    <div class="polaroid-container">
        
        <!-- Polaroid Pesan Utama (Halaman Awal) -->
        <div class="polaroid" id="mainCard">
            <!-- Ganti dengan link foto kamu berdua / foto lucu -->
            <img src="Isel.1.jpg" alt="Foto Kenangan">
            
            <h1>Maafin aku ya?</h1>
            <p>Aku janji bakal lebih baik. Plis jangan marah lagi 🥺</p>
            
            <div class="buttons">
                <button id="btnMaaf" onclick="dimaafkan()">Dimaafkan</button>
                <button id="btnTidak" onclick="moveButton(event)" onmouseover="moveButton(event)">Nggak!</button>
            </div>
        </div>

        <!-- Polaroid Muncul Ketika Dimaafkan -->
        <div class="polaroid" id="successState">
            <!-- Ganti dengan link foto bahagia/romantis -->
            <img src="Isell.jpg" alt="Foto Bahagia">
            <h1>Sayangkuu Cipaa Cantikk,, Terimakasih yaa sudah maafin aku.
                Kasih Sayang dari gantengnya kamu,, ISSEL FAREL ❤️</h1>
            <p>Sayang banget deh sama kamu!</p>
        </div>

    </div>

    <script>
        // --- 1. Fungsi Memutar Lagu ---
        const audio = document.getElementById('backsound');
        let isMusicPlaying = false;

        function playMusic() {
            if (!isMusicPlaying) {
                audio.play().catch(() => {}); // Menghindari error pemblokiran dari browser
                isMusicPlaying = true;
            }
        }

        // Memicu musik saat layar disentuh/diklik
        document.body.addEventListener('click', playMusic);
        document.body.addEventListener('touchstart', playMusic);

        // --- 2. Animasi Gelembung Hati/Teks dari Bawah ke Atas ---
        const items = ["❤️", "💖", "Maafin ya 🥺", "💕", "Plis..", "✨", "🥺"];
        
        function createBubble() {
            const el = document.createElement('div');
            el.classList.add('bubble');
            el.innerText = items[Math.floor(Math.random() * items.length)];
            
            // Posisi X diacak
            el.style.left = Math.random() * 90 + 'vw';
            // Kecepatan melayang diacak (5 sampai 10 detik)
            el.style.animationDuration = Math.random() * 5 + 5 + 's';
            
            document.body.appendChild(el);

            // Menghapus elemen setelah terbang agar web tidak lemot
            setTimeout(() => {
                el.remove();
            }, 10000);
        }

        // Membuat gelembung baru setiap 600 milidetik
        setInterval(createBubble, 600);

        // --- 3. Logika Tombol "Tidak Dimaafkan" Menghindar ---
        const btnTidak = document.getElementById('btnTidak');

        function moveButton(e) {
            if(e) e.preventDefault();
            playMusic(); // Pancing musik nyala jika disentuh

            // Bergeser acak tapi tidak jauh dari kotak tombol
            const randomX = (Math.random() - 0.5) * 200; 
            const randomY = (Math.random() - 0.5) * 200;
            
            btnTidak.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        // --- 4. Logika Jika Tombol "Dimaafkan" Ditekan ---
        function dimaafkan() {
            playMusic();
            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('successState').style.display = 'block';
        }
    </script>
</body>
</html>
